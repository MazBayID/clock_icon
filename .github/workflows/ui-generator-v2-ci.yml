name: UI Generator V2 CI

on:
  push:
    branches:
      - rebuild/ui-generator-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Production build
        run: bun run build
