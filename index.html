<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Clock — Generator Aset Smartwatch & Animation Studio</title>
    <meta name="description" content="Generator aset angka jam digital smartwatch profesional 25×50 pixel (0–9 dan :) putih di atas hitam dalam gaya modern, elegan, berteknologi, dan cyberpunk." />
    <meta property="og:title" content="Neo Clock — Generator Angka Smartwatch 25×50px" />
    <meta property="og:description" content="Generator aset angka jam digital smartwatch profesional 25×50 pixel (0–9 dan :) putih di atas hitam dalam gaya modern, elegan, berteknologi, dan cyberpunk." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#090A0D] text-[#F2F4F8] antialiased selection:bg-sky-500/30 selection:text-white">
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (title, detail) => {
          const root = document.getElementById('root');
          if (!root || root.dataset.startupError === 'shown') return;
          root.dataset.startupError = 'shown';
          const panel = document.createElement('main');
          panel.style.cssText = 'min-height:100vh;box-sizing:border-box;padding:32px;background:#090A0D;color:#F2F4F8;font:14px/1.6 system-ui,sans-serif';
          const heading = document.createElement('h1');
          heading.textContent = 'Neo Clock gagal dimuat';
          heading.style.cssText = 'font-size:20px;margin:0 0 12px;color:#fff';
          const message = document.createElement('p');
          message.textContent = title;
          const detailBox = document.createElement('pre');
          detailBox.textContent = String(detail || 'Tidak ada detail error dari browser').slice(0, 1800);
          detailBox.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#171a22;border:1px solid #394150;border-radius:8px;color:#fca5a5';
          const note = document.createElement('p');
          note.textContent = 'Kirim tangkapan layar pesan ini agar penyebabnya bisa diperbaiki.';
          panel.append(heading, message, detailBox, note);
          root.replaceChildren(panel);
        };
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement) {
            showStartupError('File JavaScript aplikasi gagal dimuat.', event.target.src);
          } else if (event instanceof ErrorEvent) {
            showStartupError('Terjadi error JavaScript saat aplikasi dijalankan.', event.message + (event.filename ? '\\n' + event.filename + ':' + event.lineno : ''));
          }
        }, true);
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          showStartupError('Terjadi promise rejection yang tidak tertangani.', reason && (reason.stack || reason.message) || reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
